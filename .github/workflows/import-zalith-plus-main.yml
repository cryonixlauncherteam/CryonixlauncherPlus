name: Import Zalith Launcher 2 Plus into Cryonix V4

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-source:
    if: !contains(github.event.head_commit.message, 'Import Zalith Launcher 2 Plus foundation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Clone upstream source
        run: git clone --depth 1 https://github.com/Star1xr/ZalithLauncher2Plus.git /tmp/zalith-plus
      - name: Import all source files and folders
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='*.jks' --exclude='.github/workflows/' /tmp/zalith-plus/ ./
          find . -type f -name '*.jks' -delete
      - name: Write Cryonix attribution
        run: |
          cat > README.md <<'EOF'
# Cryonix Launcher V4 Plus

Unofficial modified version built from the open-source Zalith Launcher 2 Plus foundation.

Source foundation:
- https://github.com/Star1xr/ZalithLauncher2Plus
- https://github.com/ZalithLauncher/ZalithLauncher2

This repository keeps applicable upstream copyright and GPL-3.0 notices.
Signing keystores are not imported; Cryonix uses its own signing keys.
EOF
          cat > CRYONIX_UPSTREAM.md <<'EOF'
# Cryonix V4 Plus upstream attribution

Imported source: https://github.com/Star1xr/ZalithLauncher2Plus

Upstream foundation: https://github.com/ZalithLauncher/ZalithLauncher2

Both projects are GPL-3.0 based. Preserve all applicable copyright, license, and attribution notices when distributing modified versions.

Signing keystore files (*.jks) are intentionally excluded from the import.
Upstream GitHub Actions workflow files are also excluded so Cryonix CI can be controlled independently.
EOF
      - name: Commit imported tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import Zalith Launcher 2 Plus foundation into Cryonix V4'
          git push